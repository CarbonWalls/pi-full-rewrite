name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Full verification (tests + clippy + 30-point sign-off)
        run: |
          ./build.sh test
          ./build.sh clippy --all-targets
          ./build.sh build --release -p pi-coding-agent
          ./scripts/verify.sh
      - name: Install cross tooling (musl amd64 + aarch64 gnu)
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang gcc-aarch64-linux-gnu
      - name: Add cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu
      - name: Build static + bundle
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PI_BUILD_SHA: ${{ github.sha }}
        run: |
          # aarch64-musl cannot cross-link with the runner's musl-gcc (regular
          # x86_64 binary only), so arm64 ships as a GLIBC build here; the
          # arm64 STATIC binary is produced on an aarch64 host
          # (scripts/release.sh) and can be attached manually.
          ./build.sh build --release --target x86_64-unknown-linux-musl -p pi-coding-agent
          # arm64 is an OPTIONAL asset: a cross-link hiccup must not block the
          # whole release, so it is allowed to fail with a warning.
          ./build.sh build --release --target aarch64-unknown-linux-gnu -p pi-coding-agent \
            || { echo "::warning::arm64 gnu build failed; shipping amd64 only"; }
          ./build.sh build --release -p pi-coding-agent
          mkdir -p dist
          cp target/release/pi dist/pi-linux-amd64
          cp target/x86_64-unknown-linux-musl/release/pi dist/pi-linux-amd64-static
          cp target/aarch64-unknown-linux-gnu/release/pi dist/pi-linux-arm64 2>/dev/null || true
          cp README.md dist/ && cp -r docs dist/ && cp -r scripts dist/
          printf 'pi %s (%s)\n' "${{ github.ref_name }}" "${{ github.sha }}" > dist/VERSION
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
