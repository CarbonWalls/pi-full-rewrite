name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Workspace tests
        env:
          RUST_BACKTRACE: 1
        # --no-fail-fast: one flaky test must not hide the rest;
        # reduced threads: cold runners are slower than a dev box.
        run: |
          ./build.sh test --no-fail-fast -- --test-threads=4 2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # surface the failure as GitHub annotations (readable via the API)
            grep -E -B2 -A10 "FAILED|panicked|failures:" /tmp/test.log | tail -n 120 | sed 's/^/::error::/'
            exit $rc
          fi
          ./build.sh test --doc
      - name: Clippy (all targets, no warnings)
        run: ./build.sh clippy --all-targets
      - name: Release build
        env:
          PI_BUILD_SHA: ${{ github.sha }}
        run: ./build.sh build --release -p pi-coding-agent
      - name: Release sign-off (28-point matrix incl. TUI + user journey)
        run: |
          ./build.sh build --release -p pi-coding-agent
          ./scripts/verify.sh
          git diff --exit-code --stat   # no build artifacts may leak into the tree

  static-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl cross tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang
      - name: Install rust (stable) with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-musl
      - name: Build static binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          PI_BUILD_SHA: ${{ github.sha }}
        run: ./build.sh build --release --target x86_64-unknown-linux-musl -p pi-coding-agent
      - name: Verify it is a static ELF
        run: |
          file target/x86_64-unknown-linux-musl/release/pi || true
          file target/x86_64-unknown-linux-musl/release/pi | grep -q "statically linked"
          ./target/x86_64-unknown-linux-musl/release/pi --version
