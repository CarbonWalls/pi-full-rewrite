name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rust (pinned — must match the dev toolchain)
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - name: Workspace tests
        env:
          RUST_BACKTRACE: 1
        # --no-fail-fast: one flaky test must not hide the rest;
        # reduced threads: cold runners are slower than a dev box.
        run: |
          set +e
          ./build.sh test --no-fail-fast -- --test-threads=1 2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ $rc -ne 0 ]; then
            # surface only the key diagnostics (the API stores ~10 annotations max)
            { echo "EXIT=$rc";               grep -aE "panicked at|assertion|FAILED|test .* \.\.\. FAILED|error\[|error:|cannot find|no such|not found|failed to" /tmp/test.log | head -8;               grep -aE "FAILED\." /tmp/test.log | head -3; } | sed 's/^/::error::/'
            exit $rc
          fi
          ./build.sh test --doc
      - name: No session data may ever be tracked
        run: |
          if git ls-files | grep -q '^\.pi/'; then
            echo "::error::session data is committed to the repo"
            git ls-files | grep '^\.pi/'
            exit 1
          fi
      - name: Clippy (all targets, no warnings)
        run: ./build.sh clippy --all-targets --locked
      - name: Release build
        env:
          PI_BUILD_SHA: ${{ github.sha }}
        run: ./build.sh build --release --locked -p pi-coding-agent
      - name: Release sign-off (31-point matrix incl. TUI + user journey)
        run: |
          ./build.sh build --release --locked -p pi-coding-agent
          ./scripts/verify.sh
          git diff --exit-code --stat   # no build artifacts may leak into the tree

  # manual-only: helpful when CI misbehaves again (uploads the test log)
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Run failing test step, capture everything
        if: always()
        run: |
          set +e
          ./build.sh test --no-fail-fast -- --test-threads=1 > /tmp/test.log 2>&1
          rc=$?
          echo "EXIT CODE: $rc" >> /tmp/test.log
          { echo "### test step output (tail)"; tail -n 200 /tmp/test.log; } >> "$GITHUB_STEP_SUMMARY"
          echo "step summary written"
          exit 0   # never fail this job; the log goes to the summary
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log

  static-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl cross tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang
      - name: Install rust (pinned) with musl target
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          target: x86_64-unknown-linux-musl
      - name: Build static binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          PI_BUILD_SHA: ${{ github.sha }}
        run: ./build.sh build --release --locked --target x86_64-unknown-linux-musl -p pi-coding-agent
      - name: Verify it is a static ELF
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/pi
          if [ ! -f "$BIN" ]; then
            echo "::error::missing $BIN"
            ls -la target/x86_64-unknown-linux-musl/release/ | head
            exit 1
          fi
          echo "::error::file(1) says: $(file "$BIN")"
          if ! file "$BIN" | grep -qiE "statically linked|static-pie linked"; then
            echo "::error::NOT static"
            exit 1
          fi
          if ! "$BIN" --version; then
            echo "::error::binary failed to run"
            exit 1
          fi
