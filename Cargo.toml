[workspace]
resolver = "2"
members = [
    "crates/pi-ai",
    "crates/pi-agent",
    "crates/pi-tui",
    "crates/pi-tools",
    "crates/pi-mcp",
    "crates/pi-coding-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/pi-rs"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "fs", "signal", "net"] }
ureq = "2.12"
crossterm = "0.28"
futures = "0.3"
walkdir = "2"
regex = "1"
glob = "0.3"
dirs = "5"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1
